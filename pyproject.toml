[project]
name = "legsynth"
version = "0.1.0"
description = "Durability-aware synthesis of planar walking linkages"
# 3.10 rather than 3.9: CI runs 3.10 and 3.12, and an untested
# floor is a claim rather than a fact.
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pillow", "pymoo"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["legsynth"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
# `O` is the crank centre. Every joint in this repo is named after the paper's
# figure - O, G, J1..J5, F - and renaming one of them to satisfy a linter would
# make the code harder to check against the paper, which is the whole point.
ignore = ["E741"]
