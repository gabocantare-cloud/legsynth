name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned. The tree is clean on 0.16.6; an unpinned upgrade brings new
        # default rules and fails this job on something cosmetic.
        run: pip install ruff==0.16.6
      - name: Lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches `requires-python` in pyproject.toml. Do not claim a floor
        # here that no job actually runs.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Check the reported numbers still reproduce
        run: python scripts/gait_report.py
      - name: Check the documents still agree with the code
        # Every published number is pinned to the sentence that quotes it. This
        # is what stops the docs drifting from the code between commits; --slow
        # is left out because it needs results/*.json, which are not in the repo.
        run: python scripts/verify_docs.py
